<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order confirmed | Little Gopal</title>
<link rel="icon" href="logo.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#36201e;--maroon:#542d27;--orange:#c45a2b;--leaf:#6a8462;--cream:#fffaf0}
  *{box-sizing:border-box}
  body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--cream)}
  .wrap{max-width:820px;margin:auto;padding:0 24px}
  .top{height:80px;display:flex;align-items:center;justify-content:space-between;background:#fffdf9}
  .brand{font:700 28px "Playfair Display";color:var(--maroon);text-decoration:none}
  .brand span{color:var(--orange)}
  .hero{text-align:center;padding:50px 0 20px}
  .check{width:70px;height:70px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 18px}
  .hero h1{font:700 clamp(30px,4vw,42px) "Playfair Display";margin:0 0 8px}
  .hero p{color:#74544e;margin:0}
  .order-id{display:inline-block;margin-top:14px;background:#f5e6d7;border:1px dashed #d9b98a;border-radius:6px;padding:8px 14px;font-weight:700;letter-spacing:.04em}
  .card{background:#fffdf9;border:1px solid #edddc9;border-radius:10px;padding:24px;margin:26px 0}
  .card h2{font:700 20px "Playfair Display";margin:0 0 14px}
  .item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eedfce;font-size:14px}
  .item:first-child{border-top:0}
  .item strong{font-family:"Playfair Display"}
  .totals-line{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:#5a423d}
  .totals-line.grand{border-top:1px solid #dfc8af;margin-top:8px;padding-top:12px;font-weight:700;font-size:16px;color:var(--ink)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .grid2 p{margin:2px 0;font-size:14px;line-height:1.6;color:#5a423d}
  .badge{display:inline-block;background:#e9efdf;color:#43602f;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;margin-top:6px}
  .badge.pending{background:#fbeede;color:#8a542a}
  .actions{display:flex;gap:12px;justify-content:center;padding:10px 0 60px;flex-wrap:wrap}
  .actions a{text-decoration:none;padding:13px 20px;border-radius:4px;font-weight:700;font-size:14px}
  .primary{background:var(--maroon);color:#fff}
  .secondary{border:1px solid var(--maroon);color:var(--maroon)}
  .missing{text-align:center;padding:70px 20px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="wrap top"><a class="brand" href="index.html"><img src="logo.jpeg" alt="" style="height:42px;width:42px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:8px">Little <span>Gopal</span></a></header>
  <main class="wrap" id="content">
    <div class="hero"><div class="check">✓</div><h1>Thank you, your order is confirmed!</h1><p>A confirmation has been recorded for your Little Gopal order.</p><div class="order-id" id="order-id-line">Order #</div></div>
  </main>
  <script src="cart.js"></script>
  <script>
    var Store = window.LittleGopalStore;
    var params = new URLSearchParams(location.search);
    var orderId = params.get('order') || localStorage.getItem('littleGopalLastOrder');
    var order = orderId ? Store.getOrder(orderId) : null;
    var content = document.getElementById('content');

    if (!order) {
      content.innerHTML = '<div class="missing"><h1 style="font-family:\'Playfair Display\'">We could not find that order</h1><p style="color:#74544e">It may have already been viewed, or the link is incorrect.</p><div class="actions" style="padding-top:24px"><a class="primary" href="index.html#bestsellers">Continue shopping</a></div></div>';
    } else {
      document.getElementById('order-id-line').textContent = 'Order #' + order.id;
      var itemsHtml = order.items.map(function (item) {
        return '<div class="item"><div><strong>' + Store.escapeHtml(item.image) + ' ' + Store.escapeHtml(item.name) + '</strong><div style="color:#8a6a61">Qty ' + item.qty + '</div></div><span>' + Store.formatMoney(item.price * item.qty) + '</span></div>';
      }).join('');
      var paidBadge = order.paymentStatus === 'Paid'
        ? '<span class="badge">Paid via ' + Store.escapeHtml(order.paymentMethod) + '</span>'
        : '<span class="badge pending">' + Store.escapeHtml(order.paymentMethod) + ' — pay on delivery</span>';
      var address = order.customer;
      content.insertAdjacentHTML('beforeend',
        '<div class="card"><h2>Order items</h2>' + itemsHtml +
        '<div class="totals-line"><span>Subtotal</span><span>' + Store.formatMoney(order.subtotal) + '</span></div>' +
        (order.discount ? '<div class="totals-line"><span>Discount' + (order.coupon ? ' (' + Store.escapeHtml(order.coupon) + ')' : '') + '</span><span>−' + Store.formatMoney(order.discount) + '</span></div>' : '') +
        '<div class="totals-line"><span>Shipping</span><span>' + (order.shipping ? Store.formatMoney(order.shipping) : 'FREE') + '</span></div>' +
        '<div class="totals-line grand"><span>Total paid</span><span>' + Store.formatMoney(order.total) + '</span></div></div>' +
        '<div class="card grid2"><div><h2>Delivery address</h2><p><strong>' + Store.escapeHtml(address.name) + '</strong></p><p>' + Store.escapeHtml(address.address) + '</p><p>' + Store.escapeHtml(address.city) + ', ' + Store.escapeHtml(address.state) + ' — ' + Store.escapeHtml(address.pincode) + '</p><p>' + Store.escapeHtml(address.phone) + ' · ' + Store.escapeHtml(address.email) + '</p></div><div><h2>Payment</h2>' + paidBadge + '<p style="margin-top:14px">Order date: ' + new Date(order.date).toLocaleString('en-IN') + '</p></div></div>' +
        '<div class="actions"><a class="primary" href="index.html#bestsellers">Continue shopping</a><a class="secondary" href="index.html">View my orders</a></div>'
      );
    }
  </script>
</body>
</html>
